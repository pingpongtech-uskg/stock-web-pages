name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:unit
      - run: node --test scripts/n8n/test-*.cjs
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest pipeline scripts -q
      - run: python scripts/verify_snapshot.py

name: Manual Pages fallback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Production deploy is explicitly requested; the action still fails closed
    # when the three Cloudflare secrets are not configured.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: dist

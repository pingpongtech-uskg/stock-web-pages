name: PEG evidence repair
run-name: PEG repair | ${{ inputs.request_id }} | ${{ inputs.market_date }}
on:
  workflow_dispatch:
    inputs:
      market_date:
        description: Current Taiwan session date (YYYY-MM-DD)
        required: true
        type: string
      request_id:
        description: Unique n8n request correlation ID
        required: true
        type: string
      search_manifest_commit:
        description: Optional exact commit containing config/peg_search_results.json
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-snapshot
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATE: ${{ inputs.market_date }}
      REQUEST_ID: ${{ inputs.request_id }}
      SEARCH_MANIFEST_COMMIT: ${{ inputs.search_manifest_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Validate dispatch and pin optional search manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import date
          assert re.fullmatch(r'[A-Za-z0-9_.:-]{1,160}', os.environ['REQUEST_ID']), 'invalid request_id'
          assert date.fromisoformat(os.environ['MARKET_DATE']).isoformat() == os.environ['MARKET_DATE'], 'invalid market_date'
          commit = os.environ.get('SEARCH_MANIFEST_COMMIT', '')
          assert not commit or re.fullmatch(r'[a-f0-9]{40}', commit), 'invalid search_manifest_commit'
          PY
          manifest="${RUNNER_TEMP}/peg_search_results.json"
          if [ -n "$SEARCH_MANIFEST_COMMIT" ]; then
            git fetch --no-tags origin "$SEARCH_MANIFEST_COMMIT"
            git show "$SEARCH_MANIFEST_COMMIT:config/peg_search_results.json" > "$manifest"
          elif [ -f config/peg_search_results.json ]; then
            cp config/peg_search_results.json "$manifest"
          else
            printf '{"marketDate":"%s","stocks":[]}' "$MARKET_DATE" > "$manifest"
          fi
          echo "PEG_MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "SOURCE_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply evidence, rebuild canonical export and fingerprint
        run: python scripts/run_peg_repair.py --market-date "$MARKET_DATE" --request-id "$REQUEST_ID" --manifest "$PEG_MANIFEST" --source-git-commit "$SOURCE_GIT_COMMIT" --actions-run-id "$GITHUB_RUN_ID"
      - name: Validate release and requested date
        run: |
          python scripts/verify_snapshot.py
          python scripts/build_publication_fingerprint.py --check --market-date "$MARKET_DATE"
      - name: Publish validated data with compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_validated_release.sh
      - name: Create PEG review proof
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          value = json.loads(Path('public/data/peg-review.json').read_text())
          print(f"requestId: {value['requestId']}")
          print(f"runId: {value['runId']}")
          print(f"marketDate: {value['marketDate']}")
          print(f"counts: {json.dumps(value['counts'], sort_keys=True)}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: peg-review-${{ inputs.market_date }}-${{ github.run_id }}
          path: public/data/peg-review.json
          if-no-files-found: error

name: Daily snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
permissions:
  contents: read
concurrency:
  group: daily-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install pytest
      - run: python scripts/fetch_finmind.py --codes "$(python -c "import json; print(','.join(json.load(open('config/tracked_symbols.json'))['symbols']))")" --output public/data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - run: python -m pytest pipeline -q
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-release
          path: dist

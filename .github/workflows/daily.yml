name: Daily snapshot and deploy
run-name: Daily screening | ${{ inputs.request_id }} | ${{ inputs.market_date }}
on:
  # n8n owns the weekday 18:00 Asia/Taipei schedule and holiday verification.
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique n8n request correlation ID
        required: true
        type: string
      market_date:
        description: Independently requested Taiwan session (YYYY-MM-DD)
        required: true
        type: string
      source_mode:
        description: Publish a validated snapshot or only probe institutional history
        required: false
        type: choice
        default: publish
        options:
          - publish
          - institutional_probe
          - ownership_recompute
      ownership_generation:
        description: Optional exact chip-state generation commit (40 hex)
        required: false
        type: string
      restore_commit:
        description: Data-only Git commit containing verified Notion cache
        required: false
        type: string
      restore_descriptor_sha256:
        description: SHA256 of independently verified cache restore descriptor
        required: false
        type: string
      restore_cache_market_date:
        description: Original cached market date
        required: false
        type: string
      restore_source_git_commit:
        description: Original cache source code commit
        required: false
        type: string
      restore_actions_run_id:
        description: Original cache Actions run ID
        required: false
        type: string
      restore_request_id:
        description: Original cache request correlation ID
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' && (inputs.source_mode == 'publish' || inputs.source_mode == 'ownership_recompute' || inputs.source_mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      MARKET_DATE: ${{ inputs.market_date }}
      SOURCE_MODE: ${{ inputs.source_mode }}
      OWNERSHIP_REQUESTED_GENERATION: ${{ inputs.ownership_generation }}
      CACHE_RESTORE_COMMIT: ${{ inputs.restore_commit }}
      CACHE_DESCRIPTOR_SHA256: ${{ inputs.restore_descriptor_sha256 }}
      CACHE_MARKET_DATE: ${{ inputs.restore_cache_market_date }}
      CACHE_SOURCE_GIT_COMMIT: ${{ inputs.restore_source_git_commit }}
      CACHE_ACTIONS_RUN_ID: ${{ inputs.restore_actions_run_id }}
      CACHE_REQUEST_ID: ${{ inputs.restore_request_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate dispatch inputs and initialize checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import date
          assert (os.environ.get('SOURCE_MODE') or 'publish') in {'publish', 'institutional_probe', 'ownership_recompute'}, 'invalid source_mode'
          assert re.fullmatch(r'[A-Za-z0-9_.:-]{1,160}', os.environ['REQUEST_ID']), 'invalid request_id'
          assert date.fromisoformat(os.environ['MARKET_DATE']).isoformat() == os.environ['MARKET_DATE'], 'invalid market_date'
          ownership_generation = os.environ.get('OWNERSHIP_REQUESTED_GENERATION', '')
          assert not ownership_generation or re.fullmatch(r'[a-f0-9]{40}', ownership_generation), 'invalid ownership generation'
          names = ['CACHE_RESTORE_COMMIT', 'CACHE_DESCRIPTOR_SHA256', 'CACHE_MARKET_DATE', 'CACHE_SOURCE_GIT_COMMIT', 'CACHE_ACTIONS_RUN_ID', 'CACHE_REQUEST_ID']
          restore = {key: os.environ.get(key, '') for key in names}
          if any(restore.values()):
              assert all(restore.values()), 'incomplete cache restore context'
              for key in ['CACHE_RESTORE_COMMIT', 'CACHE_SOURCE_GIT_COMMIT']:
                  assert re.fullmatch(r'[a-f0-9]{40}', restore[key]), 'invalid cache commit'
              assert re.fullmatch(r'[a-f0-9]{64}', restore['CACHE_DESCRIPTOR_SHA256']), 'invalid cache descriptor'
              cached = date.fromisoformat(restore['CACHE_MARKET_DATE'])
              assert cached.isoformat() == restore['CACHE_MARKET_DATE'] and cached <= date.fromisoformat(os.environ['MARKET_DATE']), 'invalid cache date'
              assert re.fullmatch(r'[1-9][0-9]{0,23}', restore['CACHE_ACTIONS_RUN_ID']), 'invalid cache run'
              assert re.fullmatch(r'[A-Za-z0-9_.:-]{1,160}', restore['CACHE_REQUEST_ID']), 'invalid cache request'
          PY
          mkdir -p .cache/finmind .cache/market-source
          echo "BUDGET_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"
          echo "SOURCE_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        id: finmind-cache
        with:
          path: .cache/finmind
          key: finmind-v1-${{ env.BUDGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            finmind-v1-${{ env.BUDGET_DATE }}-
            finmind-v1-
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Recover same-day budget from failure artifacts
        if: inputs.source_mode != 'ownership_recompute'
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_finmind_checkpoint.py --cache-dir .cache/finmind --budget-date "$BUDGET_DATE"
      - name: Restore complete daily source receipts
        uses: actions/cache/restore@v6
        with:
          path: .cache/market-source
          key: market-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-source-v1-
      - name: Restore verified Notion operational cache
        if: inputs.restore_commit != ''
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/restore_market_cache.py --restore-commit="$CACHE_RESTORE_COMMIT" --descriptor-sha256="$CACHE_DESCRIPTOR_SHA256" --cache-market-date="$CACHE_MARKET_DATE" --market-date="$MARKET_DATE" --source-git-commit="$CACHE_SOURCE_GIT_COMMIT" --actions-run-id="$CACHE_ACTIONS_RUN_ID" --request-id="$CACHE_REQUEST_ID" --source-cache-dir .cache/market-source --stock-cache-dir .cache/restored-stock-details
      - name: Fetch authoritative exchange calendar
        if: inputs.source_mode != 'ownership_recompute'
        shell: bash
        run: |
          set -euo pipefail
          calendar_restore_args=()
          if [ -n "$CACHE_MARKET_DATE" ]; then
            calendar_restore_args=(--prior-calendar-cache-dir ".cache/market-source/restored/$CACHE_MARKET_DATE")
          fi
          python scripts/build_trading_calendar.py --market-date "$MARKET_DATE" --source-cache-dir .cache/market-source "${calendar_restore_args[@]}"
      - name: Fetch official institutional universe
        if: inputs.source_mode != 'ownership_recompute'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/fetch_research_universe.py --source official --as-of "$MARKET_DATE" --config config/tracked_symbols.json --output public/data/institutional_universe.json --source-cache-dir .cache/market-source --calendar public/data/trading-calendar.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Verify independent requested date against fetched official date
        if: inputs.source_mode != 'ownership_recompute'
        run: python scripts/verify_daily_freshness.py --universe-only --market-date "$MARKET_DATE" --data-dir public/data --config config/tracked_symbols.json
      - run: python scripts/verify_tracked_universe.py --config config/tracked_symbols.json --snapshot public/data/institutional_universe.json
      - name: Pin and verify existing ownership generation without provider network
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/chip-state .artifacts/ownership
          generation="$OWNERSHIP_REQUESTED_GENERATION"
          if [ -z "$generation" ]; then generation="$(git ls-remote origin refs/heads/chip-state | cut -f1)" || generation=""; fi
          if [ -n "$generation" ]; then
            if git fetch --no-tags origin "$generation"; then
              git ls-tree -rl "$generation" > .artifacts/ownership/tree.txt
              if python - <<'PY'
          import re
          from pathlib import Path
          rows = Path('.artifacts/ownership/tree.txt').read_text().splitlines()
          assert rows
          for line in rows:
              metadata, name = line.split('\t')
              assert metadata.startswith('100644 blob ')
              assert 0 < int(metadata.split()[-1]) <= 32 * 1024 * 1024
              assert re.fullmatch(r'(?:manifest|snapshot|queue)\.json|receipts/[a-f0-9]{64}\.(?:raw|json)', name)
          PY
              then
                git archive "$generation" | tar -x -C .cache/chip-state
                if python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.cache/chip-state/manifest.json').read_bytes())
          assert manifest['verifiedMarketDate'] <= os.environ['MARKET_DATE'], 'future ownership generation'
          PY
                then
                  if python scripts/update_ownership_checkpoint.py --state-dir .cache/chip-state --verify-only --materialize-output .cache/ownership_snapshot.json; then
                  echo "OWNERSHIP_GENERATION=$generation" >> "$GITHUB_ENV"
                  echo "$generation" > .artifacts/ownership/generation.txt
                else
                  rm -f .cache/ownership_snapshot.json
                  fi
                fi
              fi
            fi
          fi
          if [ "$SOURCE_MODE" = ownership_recompute ]; then test -s .cache/ownership_snapshot.json; fi
      - name: Correct ownership only from frozen release inputs
        if: inputs.source_mode == 'ownership_recompute'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python scripts/refresh_snapshot.py --ownership-recompute --as-of "$MARKET_DATE" --output public/data --ownership-snapshot .cache/ownership_snapshot.json | tee .artifacts/ownership/recompute.json
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('.artifacts/ownership/recompute.json').read_text())['ownership_updated'] is True
          PY
      - name: Refresh official public-source snapshot first
        if: inputs.source_mode != 'ownership_recompute'
        timeout-minutes: 25
        run: python scripts/refresh_snapshot.py --as-of "$MARKET_DATE" --output public/data --ownership-snapshot .cache/ownership_snapshot.json --source-cache-dir .cache/market-source --stock-cache-dir .cache/restored-stock-details
      - name: Supplement remaining financial gaps within durable free budget
        if: inputs.source_mode != 'ownership_recompute'
        timeout-minutes: 26
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${FINMIND_TOKEN:-}" ]; then
            echo "finmind_token_present=true"
          else
            echo "finmind_token_present=false"
          fi
          BUDGET_DATE="$(python scripts/prepare_finmind_budget.py --previous-date "$BUDGET_DATE" --cache-dir .cache/finmind)"
          echo "BUDGET_DATE=$BUDGET_DATE" >> "$GITHUB_ENV"
          python scripts/fetch_finmind.py --supplement --output public/data --cache-dir .cache/finmind --budget-date "$BUDGET_DATE" --as-of "$MARKET_DATE" --max-requests 300 --max-runtime-seconds 1500
      - name: Persist completed supplementary checkpoint immediately
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/finmind
          key: finmind-v1-${{ env.BUDGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint
      - name: Recompute from existing enriched inputs without network
        if: inputs.source_mode != 'ownership_recompute'
        timeout-minutes: 5
        run: python scripts/refresh_snapshot.py --recompute-existing --as-of "$MARKET_DATE" --output public/data --ownership-snapshot .cache/ownership_snapshot.json
      - run: python scripts/verify_snapshot.py --require-growth-coverage
      - name: Publish latest data with per-stock freshness warnings
        run: python scripts/verify_daily_freshness.py --market-date "$MARKET_DATE" --data-dir public/data --config config/tracked_symbols.json --publish-advisory
      - name: Build lightweight publication fingerprint
        run: python scripts/build_publication_fingerprint.py --market-date "$MARKET_DATE"
      - name: Build canonical screening export
        run: python scripts/build_screening_export.py --data-dir public/data --request-id "$REQUEST_ID" --market-date "$MARKET_DATE" --source-git-commit "$SOURCE_GIT_COMMIT" --actions-run-id "$GITHUB_RUN_ID"
      - name: Build and validate complete market cache before publication
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ownership_args=()
          if [ -n "${OWNERSHIP_GENERATION:-}" ]; then ownership_args=(--ownership-state-dir .cache/chip-state --ownership-generation "$OWNERSHIP_GENERATION"); fi
          python scripts/build_market_cache_index.py "${ownership_args[@]}" --data-dir public/data --config config/tracked_symbols.json --source-cache-dir .cache/market-source --output .artifacts/market-cache-index --market-date "$MARKET_DATE" --request-id "$REQUEST_ID" --source-git-commit "$SOURCE_GIT_COMMIT" --actions-run-id "$GITHUB_RUN_ID" --publication-sha256 "$(python -c "import json; print(json.load(open('public/data/publication.json'))['contentHash'])")" --config-sha256 "$(python -c "import hashlib; print(hashlib.sha256(open('config/tracked_symbols.json','rb').read()).hexdigest())")" --export-payload-hash "$(python -c "import json; print(json.load(open('public/data/screening-export.json'))['payloadHash'])")"
          python scripts/export_market_cache.py --input .artifacts/market-cache-index/input.json --expected .artifacts/market-cache-index/expected.json --output .artifacts/market-cache
          cp .artifacts/market-cache-index/expected.json .artifacts/market-cache/expected.json
      - name: Preserve validated complete market cache
        uses: actions/upload-artifact@v7
        with:
          name: market-cache
          path: .artifacts/market-cache
          compression-level: 0
          if-no-files-found: error
      - run: python scripts/build_history_archive.py --require-export --as-of "$MARKET_DATE"
      - run: python scripts/verify_history_archive.py
      - run: python scripts/prune_releases.py --data-dir public/data --keep 3 --max-bytes 250000000
      - run: python scripts/verify_history_archive.py --archive public/data/archive/v1
      - run: python scripts/verify_neutral_copy.py --paths src public/data
      - run: python -m pytest pipeline scripts -q
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - name: Recheck tracked universe before publish
        run: python scripts/verify_tracked_universe.py --config config/tracked_symbols.json --snapshot public/data/institutional_universe.json --latest public/data/latest.json
      - name: Verify publication fingerprint still matches exact snapshot bytes
        run: python scripts/build_publication_fingerprint.py --check --market-date "$MARKET_DATE"
      - name: Publish validated release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/tracked_symbols.json public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: publish daily Taiwan stock snapshot"
            git push origin HEAD:main
          fi
          export PUBLISHED_GIT_COMMIT="$(git rev-parse HEAD)"
          mkdir -p .artifacts/screening-export
          cp public/data/screening-export.json .artifacts/screening-export/screening-export.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('public/data/screening-export.json').read_bytes())
          publication = {key: value[key] for key in ('sourceGitCommit', 'actionsRunId', 'requestId', 'marketDate', 'runId', 'payloadHash')}
          publication['publishedGitCommit'] = os.environ['PUBLISHED_GIT_COMMIT']
          Path('.artifacts/screening-export/publication.json').write_text(json.dumps(publication, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: screening-export
          path: .artifacts/screening-export
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: validated-static-release
          path: dist
      - name: Persist daily source receipts after success or failure
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/market-source
          key: market-source-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve pinned ownership generation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ownership-generation
          path: |
            .cache/chip-state
            .artifacts/ownership
          if-no-files-found: warn
      - name: Preserve raw source receipts after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-source-checkpoint-${{ github.run_attempt }}
          path: .cache/market-source
          if-no-files-found: warn
      - name: Persist FinMind budget, queue and rows even after failure
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/finmind
          key: finmind-v1-${{ env.BUDGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve checkpoint evidence for same-day recovery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finmind-checkpoint-${{ github.run_attempt }}
          path: .cache/finmind
          if-no-files-found: warn
  institutional_probe:
    if: github.ref == 'refs/heads/main' && inputs.source_mode == 'institutional_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      MARKET_DATE: ${{ inputs.market_date }}
      SOURCE_MODE: ${{ inputs.source_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate probe inputs and initialize checkpoint directory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from datetime import date
          assert (os.environ.get('SOURCE_MODE') or 'publish') in {'publish', 'institutional_probe', 'ownership_recompute'}, 'invalid source_mode'
          assert os.environ['SOURCE_MODE'] == 'institutional_probe', 'invalid probe mode'
          assert re.fullmatch(r'[A-Za-z0-9_.:-]{1,160}', os.environ['REQUEST_ID']), 'invalid request_id'
          assert date.fromisoformat(os.environ['MARKET_DATE']).isoformat() == os.environ['MARKET_DATE'], 'invalid market_date'
          PY
          mkdir -p .cache/finmind .artifacts/institutional-probe
          echo "BUDGET_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"
          echo "SOURCE_GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6
        with:
          path: .cache/finmind
          key: finmind-v1-${{ env.BUDGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            finmind-v1-${{ env.BUDGET_DATE }}-
            finmind-v1-
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Recover same-day budget before institutional probe
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_finmind_checkpoint.py --cache-dir .cache/finmind --budget-date "$BUDGET_DATE"
      - name: Fetch authoritative exchange calendar for probe
        timeout-minutes: 2
        run: python scripts/build_trading_calendar.py --market-date "$MARKET_DATE" --output .cache/institutional-probe/trading-calendar.json
      - name: Save probe provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = {'requestId': os.environ['REQUEST_ID'], 'marketDate': os.environ['MARKET_DATE'],
                   'sourceMode': os.environ['SOURCE_MODE'], 'sourceGitCommit': os.environ['SOURCE_GIT_COMMIT'],
                   'actionsRunId': os.environ['GITHUB_RUN_ID'], 'actionsRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'repository': os.environ['GITHUB_REPOSITORY']}
          Path('.artifacts/institutional-probe/provenance.json').write_text(json.dumps(value, sort_keys=True))
          PY
      - name: Probe institutional source within shared free budget
        timeout-minutes: 4
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${FINMIND_TOKEN:-}" ]; then
            echo "finmind_token_present=true"
          else
            echo "finmind_token_present=false"
          fi
          BUDGET_DATE="$(python scripts/prepare_finmind_budget.py --previous-date "$BUDGET_DATE" --cache-dir .cache/finmind)"
          echo "BUDGET_DATE=$BUDGET_DATE" >> "$GITHUB_ENV"
          python scripts/probe_institutional_history.py --market-date "$MARKET_DATE" --calendar .cache/institutional-probe/trading-calendar.json --cache-dir .cache/finmind --budget-date "$BUDGET_DATE" --summary .artifacts/institutional-probe/summary.json --max-data-requests 3 --official-evidence-dir pipeline/source_evidence/tpex
      - name: Persist probe checkpoint
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/finmind
          key: finmind-v1-${{ env.BUDGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint
      - name: Preserve checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finmind-checkpoint-${{ github.run_attempt }}
          path: .cache/finmind
          if-no-files-found: warn
      - name: Preserve sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: institutional-probe
          path: .artifacts/institutional-probe
          if-no-files-found: warn

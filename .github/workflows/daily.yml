name: Daily snapshot and deploy
on:
  # Hermes owns the Taipei-time trading-day schedule. Keep this workflow
  # dispatchable so the durable cron can trigger the validated release.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Fetch official institutional universe
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/fetch_research_universe.py --source official --allow-stale --config config/tracked_symbols.json --output public/data/institutional_universe.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1
      - name: Refresh FinMind seed when token is available
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FINMIND_TOKEN:-}" ]; then
            python scripts/fetch_finmind.py --codes "$(python -c "import json; print(','.join(json.load(open('config/tracked_symbols.json'))['symbols']))")" --output public/data
            echo "SNAPSHOT_MODE=live" >> "$GITHUB_ENV"
          else
            echo "FINMIND_TOKEN is not configured; keep the checked-in release and run an honest offline refresh."
            echo "SNAPSHOT_MODE=offline" >> "$GITHUB_ENV"
          fi
      - name: Fetch ownership reference cache
        run: python scripts/fetch_ownership.py --codes "$(python -c "import json; print(','.join(json.load(open('config/tracked_symbols.json'))['symbols']))")" --output .cache/ownership_snapshot.json
      - name: Refresh validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SNAPSHOT_MODE:-offline}" = "live" ]; then
            python scripts/refresh_snapshot.py --output public/data --ownership-snapshot .cache/ownership_snapshot.json
          else
            python scripts/refresh_snapshot.py --offline --output public/data --ownership-snapshot .cache/ownership_snapshot.json
          fi
      - run: python scripts/verify_snapshot.py
      - run: python scripts/build_history_archive.py
      - run: python scripts/verify_history_archive.py
      - run: python scripts/prune_releases.py --data-dir public/data --keep 3 --max-bytes 250000000
      - run: python scripts/verify_history_production.py
      - run: python scripts/verify_neutral_copy.py --paths src public/data
      - run: python -m pytest pipeline scripts -q
      - run: npm run build
      - name: Publish validated release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/tracked_symbols.json public/data
          if git diff --cached --quiet; then
            echo "No generated release changes to publish."
          else
            git commit -m "data: publish daily Taiwan stock snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-release
          path: dist

name: Daily snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
permissions:
  contents: read
concurrency:
  group: daily-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Fetch official institutional universe
        run: python scripts/fetch_research_universe.py --source official --config config/tracked_symbols.json --output public/data/institutional_universe.json
      - run: python scripts/fetch_finmind.py --codes "$(python -c "import json; print(','.join(json.load(open('config/tracked_symbols.json'))['symbols']))")" --output public/data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Fetch ownership reference cache
        run: python scripts/fetch_ownership.py --codes "$(python -c "import json; print(','.join(json.load(open('config/tracked_symbols.json'))['symbols']))")" --output .cache/ownership_snapshot.json
      - run: python scripts/refresh_snapshot.py --output public/data --ownership-snapshot .cache/ownership_snapshot.json
      - run: python scripts/verify_snapshot.py
      - run: python -m pytest pipeline scripts -q
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-release
          path: dist

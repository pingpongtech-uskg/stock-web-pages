<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Stock Radar logo</title>
  <desc id="desc">A glass square with an H-shaped market signal and rising chart line.</desc>
  <defs>
    <linearGradient id="glass" x1="16" y1="10" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#B9EEF1" stop-opacity=".74"/>
      <stop offset="1" stop-color="#F3B36C" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="ink" x1="24" y1="28" x2="74" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11222D"/>
      <stop offset="1" stop-color="#176B87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#203746" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="76" height="76" rx="20" fill="url(#glass)" filter="url(#shadow)"/>
  <rect x="11" y="11" width="74" height="74" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity=".76" stroke-width="2"/>
  <path d="M30 30v36M66 30v36M31 49h34" fill="none" stroke="url(#ink)" stroke-width="8" stroke-linecap="round"/>
  <path d="M27 62l14-13 12 8 18-23" fill="none" stroke="#D94B42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="71" cy="34" r="4.5" fill="#D94B42"/>
</svg>
